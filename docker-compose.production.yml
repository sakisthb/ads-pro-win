# Shared build config: NEXT_PUBLIC_* values are inlined into client bundles
# at build time, so they must reach the Dockerfile as build args. Compose
# interpolates them from the same `.env` file used by `env_file` (created from
# `.env.production.example`). `${VAR:?}` fails fast if a value is missing so a
# production image can never be built with placeholder config baked in.
x-next-build: &next-build
  context: .
  args:
    NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
    NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}

services:
  web:
    build: *next-build
    ports:
      - "127.0.0.1:3000:3000"
    # Read runtime config from `.env`, created on the deploy host from
    # `.env.production.example` (secrets are never committed to the repo).
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    stop_grace_period: 30s

  worker:
    build: *next-build
    command: ["node", "dist/workers/main.js"]
    # Same `.env` file as the web service (created from `.env.production.example`).
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # The worker serves no HTTP port, so it must override the image's web
    # healthcheck (probes 127.0.0.1:3000). Liveness = worker process present.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dist/workers/main.js || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    # Pass only the password (interpolated by compose from .env) — not the
    # whole env file — so the $$REDIS_PASSWORD references in command and
    # healthcheck resolve inside the container.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: >
      sh -c "redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass $$REDIS_PASSWORD"
    # Not exposed to host ports; only reachable on the internal Docker network.
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
  caddy-config:

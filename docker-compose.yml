version: '3.8'
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: node dist/workers/main.js
    env_file: .env.local
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
